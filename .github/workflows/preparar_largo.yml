name: Preparar vídeo largo (voces + imágenes)
on:
  push:
    branches: [main]
    paths: ['largos/*/historia.json', 'cortos/*/historia.json', 'radar/*/historia.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preparar-largo
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "edge-tts>=7" requests pillow
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers "rembg[cpu]"
      - run: python tools/preparar_largo.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Guardar voces e imágenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Voces e imágenes generadas [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
